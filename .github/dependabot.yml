# Keep dependencies up to date.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # GitHub Actions used by the CI, docs and release workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # Rust crates. Patch and minor bumps travel together — they are the ones that
  # merge on a green CI. A major bump of ratatui or portable-pty is an API
  # migration, so it comes as a pull request of its own rather than dragging the
  # rest of the tree with it.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      rust:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
