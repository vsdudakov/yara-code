name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: Test
        run: cargo test --all-features
      - name: Build both frontends
        run: cargo build --release --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      # The shared logic is the part unit tests can reach; the drawing code in
      # gui/ and tui/ needs a window or a terminal, so it is measured but not
      # gated.
      - name: Core coverage (gated)
        run: |
          cargo llvm-cov --all-features --ignore-filename-regex '(gui|tui|bin)/' \
            --fail-under-lines 90 --summary-only
      - name: Whole-crate coverage (reported)
        run: |
          cargo llvm-cov --all-features --summary-only | tee coverage.txt
          total=$(grep '^TOTAL' coverage.txt | awk '{print $4}' | tr -d '%')
          echo "TOTAL_COVERAGE=$total" >> "$GITHUB_ENV"
          echo "### Coverage: ${total}% of lines" >> "$GITHUB_STEP_SUMMARY"
      - name: Update the coverage badge
        # Writes to a gist that the README's badge reads, when the token for it
        # exists; the number is in the job summary either way.
        if: ${{ github.ref == 'refs/heads/main' && env.COVERAGE_GIST_TOKEN != '' }}
        env:
          COVERAGE_GIST_TOKEN: ${{ secrets.COVERAGE_GIST_TOKEN }}
          GIST_ID: ${{ vars.COVERAGE_GIST_ID }}
        run: |
          colour=$(python3 -c "t=float('${TOTAL_COVERAGE}'); print('brightgreen' if t>=80 else 'green' if t>=60 else 'yellow' if t>=40 else 'orange')")
          payload=$(python3 -c "import json,os;print(json.dumps({'files':{'yara-code-coverage.json':{'content':json.dumps({'schemaVersion':1,'label':'coverage','message':os.environ['TOTAL_COVERAGE']+'%','color':'$colour'})}}}))")
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer $COVERAGE_GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$payload" "https://api.github.com/gists/$GIST_ID" > /dev/null

  headless:
    name: Terminal frontend alone (no graphics stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The point of the tui feature: it must build on a machine with no
      # display server and no GTK, which is how it runs over SSH.
      - run: cargo build --release --no-default-features --features tui
      - run: cargo test --no-default-features --features tui
