name: Release

# Build the binary for every platform on a version tag, attach them to a
# GitHub release, and point the Homebrew tap at it.
# Trigger by pushing a tag like `v0.2.0`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS builds run on the Apple Silicon runner: GitHub has
          # retired the Intel one, and Rust cross-compiles to x86_64 with the
          # SDK that is already there.
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
          # Linux builds on the oldest runner GitHub still offers, because a
          # binary links the glibc it was built against and refuses anything
          # older: 22.04's 2.35 runs on Debian bookworm and everything since.
          # arm64 builds natively on the arm runner — a Raspberry Pi, a
          # Graviton box or an NVIDIA DGX Spark all take that one.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          staging="ycode-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$staging"
          cp target/${{ matrix.target }}/release/ycode "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "ycode-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ycode.exe" $staging
          Copy-Item README.md, LICENSE $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower() + "  $staging.zip" `
            | Out-File -Encoding ascii "$staging.zip.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: ycode-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256

  linux-packages:
    name: Debian and RPM packages (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: amd64 }
          - { os: ubuntu-22.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the packagers
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build
        run: cargo build --release --locked
      - name: Build the .deb
        run: cargo deb -p ycode --no-build --output dist/
      - name: Build the .rpm
        run: |
          mkdir -p dist
          cargo generate-rpm -p crates/ycode --output dist/
      - name: Checksums
        run: |
          cd dist
          for f in *.deb *.rpm; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -l
      - uses: actions/upload-artifact@v5
        with:
          name: ycode-linux-packages-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish the GitHub release
    needs: [build, linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Attach the binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false

  package-repos:
    name: Publish the APT and DNF repositories
    needs: release
    runs-on: ubuntu-latest
    # The repositories live in a repository of their own, served by GitHub
    # Pages; a token with write access to it is what this job needs. Skipped
    # when the secret is absent, so a fork's release still works.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      # Every step below is conditional on the token, so without it the job
      # goes green having published nothing — and `apt install ycode` keeps
      # 404ing while the release looks finished. Say so on the run.
      - name: Say so when there is nowhere to publish to
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        if: env.PACKAGES_TOKEN == ''
        run: |
          echo "::warning title=APT and DNF repositories not published::PACKAGES_TOKEN is unset, so vsdudakov/packages was left untouched. The documented 'apt install ycode' and 'dnf install ycode' will not work for this release."
      - name: Install the repository tools
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        if: env.PACKAGES_TOKEN != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c
      - name: Clone the package repository
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        if: env.PACKAGES_TOKEN != ''
        run: |
          git clone "https://x-access-token:${PACKAGES_TOKEN}@github.com/vsdudakov/packages.git" site
          # Pages would otherwise hand the tree to Jekyll, which drops what it
          # does not recognise.
          touch site/.nojekyll
      - name: Build the trees
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        if: env.PACKAGES_TOKEN != ''
        run: packaging/linux/publish-repos.sh dist site "$GITHUB_REF_NAME"
      - name: Push them
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        if: env.PACKAGES_TOKEN != ''
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ycode ${GITHUB_REF_NAME#v}"
          git push

  homebrew:
    name: Update the Homebrew tap and the AUR PKGBUILD
    needs: release
    runs-on: ubuntu-latest
    # The tap lives in its own repository; a token with write access to it is
    # the only secret this job needs. Skipped when the secret is absent, so a
    # fork's release still works.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Render the formula from the release's checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          arm_sha=$(cut -d' ' -f1 dist/ycode-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz.sha256)
          intel_sha=$(cut -d' ' -f1 dist/ycode-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz.sha256)
          linux_sha=$(cut -d' ' -f1 dist/ycode-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz.sha256)
          linux_arm_sha=$(cut -d' ' -f1 dist/ycode-${GITHUB_REF_NAME}-aarch64-unknown-linux-gnu.tar.gz.sha256)
          for template in packaging/homebrew/ycode.rb.tmpl \
                          packaging/aur/PKGBUILD.tmpl; do
            out="$(basename "${template%.tmpl}")"
            sed -e "s/@VERSION@/$version/g" \
                -e "s/@TAG@/$GITHUB_REF_NAME/g" \
                -e "s/@ARM_SHA@/$arm_sha/g" \
                -e "s/@INTEL_SHA@/$intel_sha/g" \
                -e "s/@LINUX_SHA@/$linux_sha/g" \
                -e "s/@LINUX_ARM_SHA@/$linux_arm_sha/g" \
                "$template" > "$out"
            cat "$out"
          done
      - name: Push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/vsdudakov/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp ycode.rb tap/Formula/ycode.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ycode.rb
          git commit -m "ycode ${GITHUB_REF_NAME#v}"
          git push
