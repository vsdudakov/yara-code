[package]
name = "yara"
version = "0.2.0"
edition = "2021"
description = "Minimal code editor: a GPU-accelerated window and a terminal UI, sharing one core"
license = "MIT"
repository = "https://github.com/vsdudakov/yara-ide"
readme = "README.md"

[lib]
name = "yara"
path = "src/lib.rs"

# GPU window. Needs a display server; not usable over plain SSH.
[[bin]]
name = "yara"
path = "src/bin/yara.rs"
required-features = ["gui"]

# Terminal UI. Builds and runs on a headless server.
[[bin]]
name = "yara-tui"
path = "src/bin/yara-tui.rs"
required-features = ["tui"]

[features]
default = ["gui", "tui"]
gui = ["pty", "dep:eframe", "dep:egui", "dep:rfd"]
tui = ["pty", "dep:ratatui", "dep:crossterm"]
# A real shell on a pseudo-terminal, used by both frontends.
pty = ["dep:portable-pty", "dep:vt100"]

[dependencies]
# Shared core.
regex = "1"
syntect = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Integrated terminal, both frontends.
portable-pty = { version = "0.8", optional = true }
vt100 = { version = "0.15", optional = true }

# GUI only.
eframe = { version = "0.31", features = ["wgpu"], optional = true }
egui = { version = "0.31", optional = true }
# Native Open/Save dialogs: Finder on macOS, Explorer on Windows.
rfd = { version = "0.15", optional = true }

# TUI only.
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[profile.release]
lto = "thin"
