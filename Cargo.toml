# Yara Code: two crates, one command. `yara-core` is everything the editor
# knows; `ycode` is the terminal that shows it.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.6.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/vsdudakov/yara-code"

[workspace.dependencies]
yara-core = { path = "crates/yara-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
vt100 = "0.15"
syntect = "5"

[profile.release]
lto = "thin"
