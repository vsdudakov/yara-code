# MkDocs Material configuration for the Yara Code documentation site.
# Built and deployed to GitHub Pages by .github/workflows/docs.yml.
site_name: Yara Code
site_description: >-
  Yara Code is the terminal editor for the agent loop: your coding agent —
  Claude Code, Codex, Cursor's CLI — runs in the left pane, and the right pane
  follows the diff of every edit it makes. Review as it works, scrub back,
  run agents in parallel in git worktrees. One small Rust binary, over SSH.
site_author: Yara Code contributors
site_url: https://vsdudakov.github.io/yara-code/
repo_name: vsdudakov/yara-code
repo_url: https://github.com/vsdudakov/yara-code
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Yara Code contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/code-braces-box
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  # Open Graph / Twitter cards; needs the `[imaging]` extra and system Cairo,
  # which only CI installs — `mkdocs serve` works without it.
  - social:
      enabled: !ENV [CI, false]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vsdudakov/yara-code
  generator: false

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - First run: getting-started/first-run.md
  - Guides:
      - The follow loop: guides/follow.md
      - Tasks: guides/tasks.md
      - Files and editing: guides/editing.md
      - Search and the palette: guides/search.md
      - Key bindings: guides/keys.md
      - Settings: guides/settings.md
      - Themes and syntax: guides/themes.md
      - Agent usage and updates: guides/usage.md
  - Architecture: architecture.md
  - Contributing: contributing.md
