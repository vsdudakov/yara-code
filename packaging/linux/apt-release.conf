// What apt-ftparchive writes into dists/stable/Release. The suite is called
// stable and never anything else: there is one line of releases, and a client
// that pinned to it should keep getting them.
APT::FTPArchive::Release {
    Origin "Yara Code";
    Label "Yara Code";
    Suite "stable";
    Codename "stable";
    Architectures "amd64 arm64";
    Components "main";
    Description "Yara Code — a lightweight code editor with a terminal UI and a GPU window";
};
